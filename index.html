<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ban Liên Minh Thánh Tâm - Cộng Đoàn Chúa Chiên Lành</title>
    <!-- Pure self-contained CSS - Zero external CDN dependencies -->
    <style>
        :root {
            --primary: #991b1b;
            --primary-hover: #7f1d1d;
            --primary-light: #fef2f2;
            --gold: #d97706;
            --gold-light: #fef3c7;
            --bg-gray: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius: 0.5rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        html, body {
            height: 100%;
            background-color: var(--bg-gray);
            color: var(--text-dark);
            line-height: 1.5;
        }

        /* Layout Structure */
        .header {
            background: linear-gradient(135deg, #7f1d1d, #b91c1c);
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
            box-shadow: var(--shadow-md);
        }

        .header h1 {
            font-size: 1.875rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        .header p {
            color: #fecaca;
            font-size: 1rem;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
            min-height: 100vh;
            box-sizing: border-box;
            padding-bottom: 3rem;
        }

        /* Nav Controls */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 1rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
        }

        .privacy-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .status-badge {
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-locked {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .status-unlocked {
            background-color: #dcfce7;
            color: #166534;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-gold {
            background-color: var(--gold);
            color: white;
        }

        .btn-gold:hover {
            background-color: #b45309;
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-dark);
        }

        .btn-outline:hover {
            background-color: var(--bg-gray);
        }

        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        /* Sections */
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Events Grid */
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.25rem;
            margin-bottom: 3rem;
        }

        .event-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1.25rem;
            border-left: 5px solid var(--primary);
            box-shadow: var(--shadow-sm);
            border-top: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .event-title {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .badge-new {
            background-color: #ef4444;
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.1rem 0.5rem;
            border-radius: 9999px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .event-details {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        /* Filter & Search Bar */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            align-items: center;
            justify-content: space-between;
        }

        .filter-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tab-btn {
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-muted);
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .search-input {
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            min-width: 240px;
            font-size: 0.875rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        /* Members Directory Grid */
        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        .member-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1.25rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .member-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .member-name {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .member-role {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 0.75rem;
        }

        .member-info {
            font-size: 0.875rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .blur-text {
            filter: blur(4px);
            user-select: none;
            opacity: 0.6;
        }

        .card-actions {
            margin-top: 1rem;
            padding-top: 0.75rem;
            border-top: 1px dashed var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--card-bg);
            border-radius: var(--radius);
            max-width: 500px;
            width: 100%;
            padding: 1.5rem;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .form-control {
            width: 100%;
            padding: 0.5rem;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            font-size: 0.875rem;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        @media (max-width: 640px) {
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-input {
                width: 100%;
                min-width: 0;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header class="header">
        <h1>Ban Liên Minh Thánh Tâm</h1>
        <p>Cộng Đoàn Chúa Chiên Lành • San Diego, CA</p>
    </header>

    <div class="container">
        <!-- Privacy Control Toolbar -->
        <div class="toolbar">
            <div class="privacy-status">
                <span>Trạng Thái Quyền Riêng Tư:</span>
                <span id="privacyBadge" class="status-badge status-locked">🔒 Đã Khóa (Riêng Tư)</span>
            </div>
            <div>
                <button id="authBtn" class="btn btn-gold" onclick="toggleAuthModal()">🔓 Nhập PIN Ban Trị Sự</button>
            </div>
        </div>

        <!-- Event Calendar Section -->
        <div class="section-title">
            <span>📅 Lịch Hoạt Động</span>
            <button id="addEventBtn" class="btn btn-primary btn-sm" onclick="openEventModal()" style="display:none;">+ Thêm Sự Kiện</button>
        </div>

        <div id="eventsList" class="events-grid"></div>

        <!-- Member Directory Section -->
        <div class="section-title">
            <span>👥 Danh Sách Đoàn Viên</span>
            <button id="addMemberBtn" class="btn btn-primary btn-sm" onclick="openMemberModal()" style="display:none;">+ Thêm Đoàn Viên</button>
        </div>

        <!-- Filters & Search -->
        <div class="filter-bar">
            <div class="filter-tabs">
                <button class="tab-btn active" onclick="filterMembers('ALL', this)">Tất Cả</button>
                <button class="tab-btn" onclick="filterMembers('Ban Trị Sự', this)">Ban Trị Sự</button>
                <button class="tab-btn" onclick="filterMembers('Toán 1', this)">Toán 1</button>
                <button class="tab-btn" onclick="filterMembers('Toán 2', this)">Toán 2</button>
                <button class="tab-btn" onclick="filterMembers('Toán 3', this)">Toán 3</button>
            </div>
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Tìm theo tên hoặc SĐT..." oninput="handleSearch()">
        </div>

        <!-- Members Grid -->
        <div id="membersList" class="members-grid"></div>
    </div>

    <!-- PIN Authentication Modal -->
    <div id="authModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <span>Xác Nhận PIN Ban Trị Sự</span>
                <button class="btn btn-outline btn-sm" onclick="closeAuthModal()">✕</button>
            </div>
            <div class="form-group">
                <label for="pinInput">Mã PIN Quản Trị:</label>
                <input type="password" id="pinInput" class="form-control" placeholder="Nhập PIN (VD: 2026 hoặc lmtt)">
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeAuthModal()">Hủy</button>
                <button class="btn btn-primary" onclick="verifyPin()">Xác Nhận</button>
            </div>
        </div>
    </div>

    <!-- Member CRUD Modal -->
    <div id="memberModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <span id="memberModalTitle">Thêm Đoàn Viên Mới</span>
                <button class="btn btn-outline btn-sm" onclick="closeMemberModal()">✕</button>
            </div>
            <input type="hidden" id="memberId">
            <div class="form-group">
                <label>Tên Đoàn Viên *</label>
                <input type="text" id="memberName" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Phân Tổ / Chức Vụ *</label>
                <select id="memberGroup" class="form-control">
                    <option value="Ban Trị Sự">Ban Trị Sự</option>
                    <option value="Toán 1">Toán 1</option>
                    <option value="Toán 2">Toán 2</option>
                    <option value="Toán 3">Toán 3</option>
                </select>
            </div>
            <div class="form-group">
                <label>Chức Danh (Tùy chọn)</label>
                <input type="text" id="memberTitle" class="form-control" placeholder="VD: Trưởng Ban, Đoàn Viên">
            </div>
            <div class="form-group">
                <label>Số Điện Thoại</label>
                <input type="text" id="memberPhone" class="form-control">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="memberEmail" class="form-control">
            </div>
            <div class="form-group">
                <label>Địa Chỉ</label>
                <input type="text" id="memberAddress" class="form-control">
            </div>
            <div class="form-group">
                <label>Ngày Sinh (YYYY-MM-DD)</label>
                <input type="date" id="memberDob" class="form-control">
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeMemberModal()">Hủy</button>
                <button class="btn btn-primary" onclick="saveMember()">Lưu Thông Tin</button>
            </div>
        </div>
    </div>

    <!-- Event CRUD Modal -->
    <div id="eventModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <span id="eventModalTitle">Thêm Sự Kiện Mới</span>
                <button class="btn btn-outline btn-sm" onclick="closeEventModal()">✕</button>
            </div>
            <input type="hidden" id="eventId">
            <div class="form-group">
                <label>Tên Sự Kiện *</label>
                <input type="text" id="eventTitle" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Ngày Giờ *</label>
                <input type="text" id="eventDate" class="form-control" placeholder="VD: Thứ Sáu, 06/11/2026 - 19:00" required>
            </div>
            <div class="form-group">
                <label>Địa Điểm *</label>
                <input type="text" id="eventLocation" class="form-control" placeholder="VD: Thánh Đường Chúa Chiên Lành" required>
            </div>
            <div class="form-group">
                <label>Mô Tả</label>
                <textarea id="eventDesc" class="form-control" rows="3"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeEventModal()">Hủy</button>
                <button class="btn btn-primary" onclick="saveEvent()">Lưu Sự Kiện</button>
            </div>
        </div>
    </div>

    <!-- Pure Javascript Engine -->
    <script>
        const INITIAL_EVENTS = [
            {
                id: 'evt-1',
                title: 'Họp Định Kỳ Ban Trị Sự',
                dateStr: 'Thứ Sáu, 06/11/2026 - 19:00',
                location: 'Phòng Hội Cộng Đoàn',
                description: 'Họp chuẩn bị cho Lễ Kính Thánh Tâm Chúa Giêsu.',
                createdAt: new Date().toISOString()
            },
            {
                id: 'evt-2',
                title: 'Giờ Chầu Thánh Thể Đoàn Liên Minh',
                dateStr: 'Thứ Bảy, 14/11/2026 - 18:00',
                location: 'Thánh Đường Chúa Chiên Lành',
                description: 'Chầu Thánh Thể cầu nguyện cho các gia đình trong ban.',
                createdAt: new Date(Date.now() - 10 * 86400000).toISOString()
            }
        ];

        const INITIAL_MEMBERS = [
            {
                id: 'mem-1',
                name: 'Giuse Maria Trần Văn Hùng',
                group: 'Ban Trị Sự',
                title: 'Trưởng Ban',
                phone: '(619) 555-1001',
                email: 'hung.tran@example.com',
                address: '4521 El Cajon Blvd, San Diego, CA 92115',
                dob: '1970-03-12'
            },
            {
                id: 'mem-2',
                name: 'Maria Phạm Thị Lan',
                group: 'Ban Trị Sự',
                title: 'Thư Ký',
                phone: '(858) 555-1002',
                email: 'lan.pham@example.com',
                address: '7890 Convoy St, San Diego, CA 92111',
                dob: '1975-07-22'
            },
            {
                id: 'mem-3',
                name: 'Phaolô Nguyễn Minh Tâm',
                group: 'Toán 1',
                title: 'Toán Trưởng',
                phone: '(619) 555-1003',
                email: 'tam.nguyen@example.com',
                address: '1234 Clairemont Mesa Blvd, San Diego, CA 92117',
                dob: '1982-11-05'
            },
            {
                id: 'mem-4',
                name: 'Têrêsa Hoàng Mai Linh',
                group: 'Toán 1',
                title: 'Đoàn Viên',
                phone: '(858) 555-1004',
                email: 'linh.hoang@example.com',
                address: '3210 University Ave, San Diego, CA 92104',
                dob: '1988-09-14'
            },
            {
                id: 'mem-5',
                name: 'Dominic Vũ Thành Long',
                group: 'Toán 2',
                title: 'Toán Trưởng',
                phone: '(619) 555-1005',
                email: 'long.vu@example.com',
                address: '6543 Mira Mesa Blvd, San Diego, CA 92126',
                dob: '1980-01-30'
            },
            {
                id: 'mem-6',
                name: 'Anna Đỗ Thị Ngọc',
                group: 'Toán 2',
                title: 'Đoàn Viên',
                phone: '(858) 555-1006',
                email: 'ngoc.do@example.com',
                address: '9876 Balboa Ave, San Diego, CA 92123',
                dob: '1992-06-18'
            },
            {
                id: 'mem-7',
                name: 'Gioan Baotixita Ngô Văn Phúc',
                group: 'Toán 3',
                title: 'Toán Trưởng',
                phone: '(619) 555-1007',
                email: 'phuc.ngo@example.com',
                address: '1122 Sports Arena Blvd, San Diego, CA 92110',
                dob: '1978-12-03'
            },
            {
                id: 'mem-8',
                name: 'Catarina Bùi Diễm Hương',
                group: 'Toán 3',
                title: 'Đoàn Viên',
                phone: '(858) 555-1008',
                email: 'huong.bui@example.com',
                address: '4455 Morena Blvd, San Diego, CA 92117',
                dob: '1990-04-25'
            }
        ];

        let members = JSON.parse(localStorage.getItem('lmtt_members')) || INITIAL_MEMBERS;
        let events = JSON.parse(localStorage.getItem('lmtt_events')) || INITIAL_EVENTS;
        let isAuthenticated = localStorage.getItem('lmtt_auth') === 'true';
        let currentFilter = 'ALL';

        function initApp() {
            updateAuthUI();
            renderEvents();
            renderMembers();
        }

        function updateAuthUI() {
            const badge = document.getElementById('privacyBadge');
            const authBtn = document.getElementById('authBtn');
            const addMemberBtn = document.getElementById('addMemberBtn');
            const addEventBtn = document.getElementById('addEventBtn');

            if (isAuthenticated) {
                badge.className = 'status-badge status-unlocked';
                badge.innerHTML = '🔓 Đã Mở Khóa (Công Khai)';
                authBtn.innerText = '🔒 Khóa Lại';
                authBtn.className = 'btn btn-outline';
                addMemberBtn.style.display = 'inline-flex';
                addEventBtn.style.display = 'inline-flex';
            } else {
                badge.className = 'status-badge status-locked';
                badge.innerHTML = '🔒 Đã Khóa (Riêng Tư)';
                authBtn.innerText = '🔓 Nhập PIN Ban Trị Sự';
                authBtn.className = 'btn btn-gold';
                addMemberBtn.style.display = 'none';
                addEventBtn.style.display = 'none';
            }
            renderMembers();
        }

        function toggleAuthModal() {
            if (isAuthenticated) {
                isAuthenticated = false;
                localStorage.setItem('lmtt_auth', 'false');
                updateAuthUI();
            } else {
                document.getElementById('pinInput').value = '';
                document.getElementById('authModal').classList.add('active');
                document.getElementById('pinInput').focus();
            }
        }

        function closeAuthModal() {
            document.getElementById('authModal').classList.remove('active');
        }

        function verifyPin() {
            const pin = document.getElementById('pinInput').value;
            if (pin === '2026' || pin === 'lmtt') {
                isAuthenticated = true;
                localStorage.setItem('lmtt_auth', 'true');
                closeAuthModal();
                updateAuthUI();
            } else {
                alert('Mã PIN không chính xác!');
            }
        }

        function renderEvents() {
            const container = document.getElementById('eventsList');
            if (events.length === 0) {
                container.innerHTML = '<div class="empty-state">Chưa có sự kiện nào.</div>';
                return;
            }

            container.innerHTML = events.map(evt => `
                <div class="event-card">
                    <div class="event-header">
                        <span class="event-title">${evt.title}</span>
                    </div>
                    <div class="event-details">
                        <div>📅 <strong>Thời gian:</strong> ${evt.dateStr}</div>
                        <div>📍 <strong>Địa điểm:</strong> ${evt.location}</div>
                        ${evt.description ? `<div>📝 <strong>Mô tả:</strong> ${evt.description}</div>` : ''}
                    </div>
                    ${isAuthenticated ? `
                        <div class="card-actions">
                            <button class="btn btn-outline btn-sm" onclick="editEvent('${evt.id}')">Sửa</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteEvent('${evt.id}')">Xóa</button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function renderMembers() {
            const container = document.getElementById('membersList');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();

            let filtered = members.filter(m => {
                const matchesGroup = currentFilter === 'ALL' || m.group === currentFilter;
                const matchesSearch = m.name.toLowerCase().includes(searchQuery) || (m.phone && m.phone.includes(searchQuery));
                return matchesGroup && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">Không tìm thấy đoàn viên phù hợp.</div>';
                return;
            }

            container.innerHTML = filtered.map(m => `
                <div class="member-card">
                    <div class="member-name">${m.name}</div>
                    <div class="member-role">${m.group} ${m.title ? '• ' + m.title : ''}</div>
                    <div class="member-info">
                        <div class="info-row">📞 <span>SĐT:</span> <span class="${isAuthenticated ? '' : 'blur-text'}">${m.phone || 'Chưa cập nhật'}</span></div>
                        <div class="info-row">✉️ <span>Email:</span> <span class="${isAuthenticated ? '' : 'blur-text'}">${m.email || 'Chưa cập nhật'}</span></div>
                        <div class="info-row">🏠 <span>Địa chỉ:</span> <span class="${isAuthenticated ? '' : 'blur-text'}">${m.address || 'Chưa cập nhật'}</span></div>
                        <div class="info-row">🎂 <span>Ngày sinh:</span> <span class="${isAuthenticated ? '' : 'blur-text'}">${m.dob || 'Chưa cập nhật'}</span></div>
                    </div>
                    ${isAuthenticated ? `
                        <div class="card-actions">
                            <button class="btn btn-outline btn-sm" onclick="editMember('${m.id}')">Sửa</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteMember('${m.id}')">Xóa</button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function filterMembers(group, btnElement) {
            currentFilter = group;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            renderMembers();
        }

        function handleSearch() {
            renderMembers();
        }

        // Member Modal Actions
        function openMemberModal(id = null) {
            document.getElementById('memberModal').classList.add('active');
            if (id) {
                document.getElementById('memberModalTitle').innerText = 'Chỉnh Sửa Đoàn Viên';
                const m = members.find(item => item.id === id);
                document.getElementById('memberId').value = m.id;
                document.getElementById('memberName').value = m.name;
                document.getElementById('memberGroup').value = m.group;
                document.getElementById('memberTitle').value = m.title || '';
                document.getElementById('memberPhone').value = m.phone || '';
                document.getElementById('memberEmail').value = m.email || '';
                document.getElementById('memberAddress').value = m.address || '';
                document.getElementById('memberDob').value = m.dob || '';
            } else {
                document.getElementById('memberModalTitle').innerText = 'Thêm Đoàn Viên Mới';
                document.getElementById('memberId').value = '';
                document.getElementById('memberName').value = '';
                document.getElementById('memberGroup').value = 'Ban Trị Sự';
                document.getElementById('memberTitle').value = '';
                document.getElementById('memberPhone').value = '';
                document.getElementById('memberEmail').value = '';
                document.getElementById('memberAddress').value = '';
                document.getElementById('memberDob').value = '';
            }
        }

        function closeMemberModal() {
            document.getElementById('memberModal').classList.remove('active');
        }

        function saveMember() {
            const id = document.getElementById('memberId').value;
            const name = document.getElementById('memberName').value.trim();
            if (!name) {
                alert('Vui lòng nhập tên đoàn viên!');
                return;
            }

            const memberData = {
                id: id ? id : 'mem-' + Date.now(),
                name: name,
                group: document.getElementById('memberGroup').value,
                title: document.getElementById('memberTitle').value.trim(),
                phone: document.getElementById('memberPhone').value.trim(),
                email: document.getElementById('memberEmail').value.trim(),
                address: document.getElementById('memberAddress').value.trim(),
                dob: document.getElementById('memberDob').value
            };

            if (id) {
                const index = members.findIndex(m => m.id === id);
                members[index] = memberData;
            } else {
                members.push(memberData);
            }

            localStorage.setItem('lmtt_members', JSON.stringify(members));
            closeMemberModal();
            renderMembers();
        }

        function editMember(id) {
            openMemberModal(id);
        }

        function deleteMember(id) {
            if (confirm('Bạn có chắc chắn muốn xóa đoàn viên này không?')) {
                members = members.filter(m => m.id !== id);
                localStorage.setItem('lmtt_members', JSON.stringify(members));
                renderMembers();
            }
        }

        // Event Modal Actions
        function openEventModal(id = null) {
            document.getElementById('eventModal').classList.add('active');
            if (id) {
                document.getElementById('eventModalTitle').innerText = 'Chỉnh Sửa Sự Kiện';
                const e = events.find(item => item.id === id);
                document.getElementById('eventId').value = e.id;
                document.getElementById('eventTitle').value = e.title;
                document.getElementById('eventDate').value = e.dateStr;
                document.getElementById('eventLocation').value = e.location;
                document.getElementById('eventDesc').value = e.description || '';
            } else {
                document.getElementById('eventModalTitle').innerText = 'Thêm Sự Kiện Mới';
                document.getElementById('eventId').value = '';
                document.getElementById('eventTitle').value = '';
                document.getElementById('eventDate').value = '';
                document.getElementById('eventLocation').value = '';
                document.getElementById('eventDesc').value = '';
            }
        }

        function closeEventModal() {
            document.getElementById('eventModal').classList.remove('active');
        }

        function saveEvent() {
            const id = document.getElementById('eventId').value;
            const title = document.getElementById('eventTitle').value.trim();
            const dateStr = document.getElementById('eventDate').value.trim();
            const location = document.getElementById('eventLocation').value.trim();

            if (!title || !dateStr || !location) {
                alert('Vui lòng điền đầy đủ các thông tin bắt buộc!');
                return;
            }

            const eventData = {
                id: id ? id : 'evt-' + Date.now(),
                title: title,
                dateStr: dateStr,
                location: location,
                description: document.getElementById('eventDesc').value.trim(),
                createdAt: new Date().toISOString()
            };

            if (id) {
                const index = events.findIndex(e => e.id === id);
                events[index] = eventData;
            } else {
                events.push(eventData);
            }

            localStorage.setItem('lmtt_events', JSON.stringify(events));
            closeEventModal();
            renderEvents();
        }

        function editEvent(id) {
            openEventModal(id);
        }

        function deleteEvent(id) {
            if (confirm('Bạn có chắc chắn muốn xóa sự kiện này không?')) {
                events = events.filter(e => e.id !== id);
                localStorage.setItem('lmtt_events', JSON.stringify(events));
                renderEvents();
            }
        }

        // Initialize on load
        window.onload = initApp;
    </script>
</body>
</html>
